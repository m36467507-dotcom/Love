<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Rafqahh</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--gold:#e9c46a;--cream:#fff4e0;--night:#0b1530;--night2:#142349}
  body{background:#050a18;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Georgia,"Segoe UI",Arial,serif}
  .phone{width:100%;max-width:390px;height:720px;background:radial-gradient(circle at 50% 0%,#1d2f63 0%,var(--night) 55%,#070d1f 100%);border-radius:24px;position:relative;overflow:hidden;color:var(--cream)}
  .stars{position:absolute;inset:0;pointer-events:none;z-index:0}
  .stars i{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;opacity:.7;animation:tw 3s infinite ease-in-out}
  @keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}

  /* LOCK */
  #lock{position:absolute;inset:0;z-index:50;background:radial-gradient(circle at 50% 30%,#1d2f63,#080e22 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center}
  #lock.hide{opacity:0;pointer-events:none;transition:.8s}
  .moon{width:84px;height:84px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff7dc,var(--gold));box-shadow:0 0 50px rgba(233,196,106,.55);margin-bottom:26px}
  .lock-title{font-size:30px;font-weight:400;margin-bottom:6px}
  .lock-title b{color:var(--gold)}
  .lock-sub{font-size:13px;color:#a9b6d9;margin-bottom:26px}
  .pass-input{width:100%;max-width:250px;padding:14px;border-radius:99px;border:1px solid rgba(233,196,106,.5);background:rgba(255,255,255,.06);color:#fff;font-size:15px;text-align:center;outline:none}
  .pass-btn{margin-top:14px;background:var(--gold);color:#1a1a2e;border:none;padding:12px 46px;border-radius:99px;font-weight:700;font-size:15px;cursor:pointer}
  .pass-error{color:#ff9fb0;font-size:13px;margin-top:12px;min-height:18px}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .shake{animation:shake .3s}

  /* HEADER */
  .top{position:absolute;top:0;left:0;right:0;height:78px;z-index:10;display:flex;align-items:center;gap:12px;padding:0 18px;background:rgba(11,21,48,.85);backdrop-filter:blur(8px);border-bottom:1px solid rgba(233,196,106,.2)}
  .avatar{width:42px;height:42px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff7dc,var(--gold));display:flex;align-items:center;justify-content:center;color:#1a1a2e;font-weight:800}
  .who b{display:block;font-size:16px}
  .who span{font-size:11px;color:#a9b6d9}
  .vinyl{margin-left:auto;width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;background:radial-gradient(circle,var(--gold) 0 18%,#111 19% 100%);box-shadow:0 0 0 2px rgba(233,196,106,.4);position:relative}
  .vinyl.spin{animation:spin 3s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* CHAT */
  #chat{position:absolute;top:78px;bottom:84px;left:0;right:0;overflow-y:auto;padding:18px 16px;z-index:5;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
  #chat::-webkit-scrollbar{display:none}
  .bubble{max-width:82%;padding:11px 15px;border-radius:18px 18px 18px 4px;background:rgba(255,244,224,.1);border:1px solid rgba(255,244,224,.15);font-size:14.5px;line-height:1.65;direction:ltr;text-align:left;animation:pop .45s ease both}
  .bubble.last{background:linear-gradient(135deg,#e9c46a,#f4a261);color:#2a1a05;border:none;font-weight:700}
  .day{align-self:center;font-size:11px;letter-spacing:2px;color:var(--gold);background:rgba(233,196,106,.12);padding:5px 14px;border-radius:99px;animation:pop .4s both}
  .typing{display:flex;gap:5px;padding:14px 16px;width:62px}
  .typing i{width:7px;height:7px;border-radius:50%;background:#a9b6d9;animation:bl 1s infinite}
  .typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
  @keyframes bl{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}
  @keyframes pop{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}

  .polaroid{align-self:flex-start;background:#fffaf0;padding:10px 10px 12px;border-radius:4px;width:232px;color:#2a1a05;box-shadow:0 10px 30px rgba(0,0,0,.5);position:relative;animation:pop .6s both;transform:rotate(-2deg);direction:ltr}
  .polaroid.r{transform:rotate(2deg)}
  .polaroid::before{content:"";position:absolute;top:-10px;left:50%;width:70px;height:22px;transform:translateX(-50%) rotate(-3deg);background:rgba(233,196,106,.7)}
  .polaroid .ph{width:100%;height:248px;background:#1d2f63 center/cover;border-radius:2px}
  .polaroid .cap{font-size:13px;margin-top:9px;font-style:italic}
  .polaroid .dt{font-size:11px;color:#8a6d1f;font-weight:700;letter-spacing:1px;margin-top:2px}

  /* FOOTER */
  .foot{position:absolute;bottom:0;left:0;right:0;height:84px;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(11,21,48,.9);border-top:1px solid rgba(233,196,106,.2)}
  #next{background:var(--gold);color:#1a1a2e;border:none;border-radius:99px;padding:14px 48px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit}
  #next:disabled{opacity:.45}
</style>
</head>
<body>
<div class="phone">
  <div class="stars" id="stars"></div>
  <audio id="song" src="song.mp3" loop preload="auto"></audio>

  <div id="lock">
    <div class="moon"></div>
    <div class="lock-title">For <b>Rafqahh</b></div>
    <div class="lock-sub">رسالة ليكي إنتي بس</div>
    <input type="password" id="passInput" class="pass-input" placeholder="الباسورد">
    <button class="pass-btn" id="passBtn">افتحي</button>
    <div class="pass-error" id="passError"></div>
  </div>

  <div class="top">
    <div class="avatar">R</div>
    <div class="who"><b>Rafqahh</b><span>اللي لسه في القلب</span></div>
    <button class="vinyl" id="vinyl" aria-label="music"></button>
  </div>

  <div id="chat"></div>

  <div class="foot"><button id="next">ابدئي</button></div>
</div>

<script>
  // نجوم الخلفية
  (function(){var s=document.getElementById('stars'),h='';for(var i=0;i<45;i++){h+='<i style="left:'+Math.random()*100+'%;top:'+Math.random()*100+'%;animation-delay:'+(Math.random()*3)+'s"></i>';}s.innerHTML=h;})();

  // المحتوى — عدّلي النصوص والصور والتواريخ من هنا
  var steps=[
    {t:'text',s:"I wanted to tell you something, but honestly, I don't know if you'll understand me."},
    {t:'text',s:"I miss you so much… your voice, your features, your beautiful smile that I could never get enough of."},
    {t:'text',s:"I miss our days, our conversations, and the nights we spent talking."},
    {t:'day',s:'1 / 10 / 2025'},
    {t:'photo',src:'photo1.jpg',cap:'The day we met',date:'1 / 10 / 2025',r:false},
    {t:'text',s:"I never knew that day would change everything in my life."},
    {t:'day',s:'22 / 3 / 2026'},
    {t:'photo',src:'photo2.jpg',cap:'Our first meeting',date:'22 / 3 / 2026',r:true},
    {t:'text',s:"I still remember every detail of that day, your smile, your voice."},
    {t:'text',s:"Your presence meant so much to me, and your absence has affected me more than you could ever imagine."},
    {t:'text',s:"You left me with so many beautiful memories, but where are you now? Where did all your promises go?"},
    {t:'text',s:"You told me you'd never leave me or abandon me like everyone else."},
    {t:'photo',src:'photo3.jpg',cap:'Still you',date:'even now',r:false},
    {t:'text',s:"I know my words might not mean anything to you anymore, but what can I do? I have no control over a heart that truly loved you."},
    {t:'last',s:"Even after all this time, my heart still misses you. ♡"}
  ];
  var i=0,busy=false,chat=document.getElementById('chat'),btn=document.getElementById('next');

  function scroll(){chat.scrollTop=chat.scrollHeight;}
  function add(el){chat.appendChild(el);setTimeout(scroll,30);}
  function node(cls,html){var d=document.createElement('div');d.className=cls;d.innerHTML=html;return d;}
  function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;');}

  function show(st){
    if(st.t==='day') add(node('day',esc(st.s)));
    else if(st.t==='photo'){
      var p=node('polaroid'+(st.r?' r':''),'<div class="ph"></div><div class="cap">'+esc(st.cap)+'</div><div class="dt">'+esc(st.date)+'</div>');
      p.querySelector('.ph').style.backgroundImage="url('"+st.src+"')";
      add(p);
    }
    else add(node('bubble'+(st.t==='last'?' last':''),esc(st.s)));
  }

  function next(){
    if(busy)return;
    if(i>=steps.length){chat.innerHTML='';i=0;btn.textContent='ابدئي';return;}
    busy=true;btn.disabled=true;
    var st=steps[i++];
    if(st.t==='text'||st.t==='last'){
      var ty=node('bubble typing','<i></i><i></i><i></i>');add(ty);
      setTimeout(function(){ty.remove();show(st);fin();},Math.min(500+st.s.length*14,1800));
    }else{show(st);setTimeout(fin,500);}
  }
  function fin(){
    busy=false;btn.disabled=false;
    btn.textContent=i>=steps.length?'من الأول':'كمّلي';
  }
  btn.addEventListener('click',next);

  // الباسورد
  function checkPass(){
    var inp=document.getElementById('passInput'),v=inp.value.trim();
    if(v==='رفقهه'||v.toLowerCase()==='rafqahh'){document.getElementById('lock').classList.add('hide');playSong();}
    else{inp.classList.remove('shake');void inp.offsetWidth;inp.classList.add('shake');
      document.getElementById('passError').textContent='الباسورد غلط، جربي تاني';inp.value='';inp.focus();}
  }
  document.getElementById('passBtn').addEventListener('click',checkPass);
  document.getElementById('passInput').addEventListener('keydown',function(e){if(e.key==='Enter')checkPass();});

  // الموسيقى
  var song=document.getElementById('song'),vinyl=document.getElementById('vinyl'),playing=false;
  function playSong(){song.play().then(function(){playing=true;vinyl.classList.add('spin');}).catch(function(){});}
  vinyl.addEventListener('click',function(){
    if(playing){song.pause();playing=false;vinyl.classList.remove('spin');}else playSong();
  });
</script>
</body>
</html>
